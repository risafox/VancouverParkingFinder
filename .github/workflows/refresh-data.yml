name: Refresh parking data

# Weekly rebuild of data/*.json (meters, ticket hotspots, off-street lots).
# The site serves these static files; the browser caches them for 7 days.
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC (~1-2 AM Vancouver)
  workflow_dispatch: {}     # run manually: Actions tab -> Refresh parking data -> Run workflow

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build data
        run: python scripts/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): weekly refresh $(date -u +%F)"
            git push
          fi
